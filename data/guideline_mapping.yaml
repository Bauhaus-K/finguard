system_features:
  - id: F-CALC
    name: 결정론적 계산 엔진
    description: 이자·상환액·수수료 등 모든 수치를 LLM 이 아닌 순수 함수(Decimal)가 계산한다. 단위 테스트 커버리지 100%.
    evidence: [backend/app/calc, 감사 로그 상세의 도구 호출 결과]
  - id: F-NUMERIC
    name: 수치 출처 검증
    description: 답변의 금액·금리·기간을 같은 요청의 계산·조회 결과와 대조하고, 출처 없는 수치는 차단 후 재생성 1회, 실패 시 상담원 이관.
    evidence: [rules/default.yaml#numeric, 감사 로그 상세의 numeric 검사 결과]
  - id: F-DISCLOSURE
    name: 필수 고지 자동 첨부
    description: 답변이 다루는 상품 유형(예금·적금·대출)의 필수 고지가 없으면 자동으로 덧붙인다.
    evidence: [rules/default.yaml#disclosures]
  - id: F-FORBIDDEN
    name: 금지 표현 검사
    description: 승인·수익 보장 등 금지 표현을 사전·정규식으로 탐지해 수정하거나 차단한다. LLM 판별은 보조 수단(설정으로 켬).
    evidence: [rules/default.yaml#forbidden_expressions]
  - id: F-SUITABILITY
    name: 대출 적합성 확인
    description: 대출을 권유하거나 개인별 상환액을 안내하기 전에 소득·부채·고용 형태·용도 확인 기록을 요구한다. 심사·승인 판단은 하지 않는다.
    evidence: [rules/default.yaml#suitability, record_suitability_check 도구]
  - id: F-PII
    name: 개인정보 마스킹
    description: 주민등록번호·카드번호·전화번호·계좌번호를 입력(LLM 전송 전)·출력·감사 로그에서 마스킹한다.
    evidence: [backend/app/privacy/pii.py, rules/default.yaml#pii]
  - id: F-SCOPE
    name: 업무 범위 제한·상담원 이관
    description: 투자 추천·세무 대리·법률 판단 등 범위 밖 요청과 답변을 탐지해 상담원에게 이관한다.
    evidence: [rules/default.yaml#scope, escalate_to_human 도구]
  - id: F-FAILSAFE
    name: 실패 시 안전한 처리
    description: LLM 오류·거절, 검사 오류, 규칙 파일 오류 시 답변을 내보내지 않고 상담원에게 이관한다.
    evidence: [backend/app/agent/loop.py, backend/app/gateway/engine.py]
  - id: F-AUDIT
    name: 해시 체인 감사 로그
    description: 요청마다 질문→도구 호출→원본 답변→검사 결과→최종 답변을 append-only 해시 체인으로 저장하고 위변조를 검증·내보낸다.
    evidence: [감사 로그 화면, GET /v1/audit/verify, CSV/JSON 내보내기]
  - id: F-RULES
    name: 규칙 외부화·버전 기록
    description: 검사 규칙을 YAML 로 관리하고 금융사별로 덮어쓴다. 요청마다 적용된 규칙 버전·다이제스트를 감사 로그에 남긴다.
    evidence: [rules/, 규칙 화면]
  - id: F-LLM-SWAP
    name: LLM 공급자 교체 가능 구조
    description: LLM 호출을 어댑터 인터페이스 뒤에 두어 온프레미스 모델로 교체할 수 있다.
    evidence: [backend/app/llm/base.py]
  - id: F-EVAL
    name: 평가 체계
    description: 골든셋 50·레드팀 40 문항과 공격 답변 40건으로 수치 출처 불일치·필수 고지 포함률·레드팀 방어율·과잉 차단률·지연·비용을 측정해 리포트로 남긴다.
    evidence: [eval/golden.jsonl, eval/redteam.jsonl, make eval, eval/reports/]
