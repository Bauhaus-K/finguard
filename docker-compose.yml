# 로컬 개발용. 기본 개발 DB 는 SQLite 이며, PostgreSQL+pgvector 가 필요할 때 사용한다.
#   make db-up                       # DB 만 실행
#   docker compose up --build        # DB + 백엔드 + 대시보드(http://localhost:3000)
# 백엔드 컨테이너의 DATABASE_URL 은 아래 environment 로 덮어쓴다.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: finguard
      POSTGRES_PASSWORD: finguard
      POSTGRES_DB: finguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finguard"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://finguard:finguard@db:5432/finguard
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >-
      sh -c "uv run alembic upgrade head && uv run python -m app.db.seed &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
      # 백엔드 DEMO_API_KEY / DEMO_ADMIN_KEY 와 같아야 한다 (.env 에서 덮어쓰기)
      FINGUARD_API_KEY: ${DEMO_API_KEY:-demo-key-change-me}
      FINGUARD_ADMIN_KEY: ${DEMO_ADMIN_KEY:-demo-admin-key-change-me}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
